name: Costruzione dell'indice di impronte

# Avvio manuale, oppure con una modifica a tools/indice/siti.json.
# Il risultato (solo impronte, indirizzi e titoli) va nel ramo "indice-build", da controllare prima della pubblicazione.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Riusa le pagine già lette da questa esecuzione (vuoto: rileggi tutto)"
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - tools/indice/siti.json

permissions:
  contents: write
  actions: read

concurrency:
  group: indice
  cancel-in-progress: false

jobs:
  piano:
    runs-on: ubuntu-latest
    outputs:
      matrice: ${{ steps.m.outputs.matrice }}
      archivi: ${{ steps.m.outputs.archivi }}
      archivio: ${{ steps.m.outputs.archivio }}
      data: ${{ steps.m.outputs.data }}
      dal: ${{ steps.m.outputs.dal }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open('tools/indice/siti.json'))
          print('matrice=' + json.dumps({'include': c['siti']}))
          a = c['archivi']
          print('archivi=' + ','.join(a))
          print('archivio=' + (a[0] if len(a) == 1 else a[-1] + '..' + a[0]))
          print('data=' + c['data'])
          print('dal=' + c.get('dal', c['data']))
          EOF

  sito:
    needs: piano
    if: ${{ !inputs.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.piano.outputs.matrice) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm ci --no-audit --no-fund --prefix tools/indice
          pip install duckdb==1.5.6
      - name: Elenco delle pagine (indice a colonne di Common Crawl)
        run: |
          mkdir -p lavoro
          python3 tools/indice/elenca_colonne.py ${{ needs.piano.outputs.archivi }} ${{ matrix.dominio }} ${{ matrix.modo }} lavoro/grezzo-${{ matrix.dominio }}.jsonl
          node tools/indice/costruisci.js elenca --da lavoro/grezzo-${{ matrix.dominio }}.jsonl --archivio ${{ needs.piano.outputs.archivio }} --dominio ${{ matrix.dominio }} --modo ${{ matrix.modo }} --filtro "${{ matrix.filtro }}" --lavoro lavoro
      - name: Lettura delle pagine e impronte
        run: node tools/indice/costruisci.js scarica --dominio ${{ matrix.dominio }} --lavoro lavoro --max ${{ matrix.max }} --concorrenza 6
      - uses: actions/upload-artifact@v4
        with:
          name: parziale-${{ matrix.dominio }}
          path: |
            lavoro/parziale-*.bin
            lavoro/documenti-*.jsonl
            lavoro/campioni-*.jsonl
          retention-days: 7

  unisci:
    needs: [piano, sito]
    if: always() && needs.piano.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: parziale-*
          path: lavoro
          merge-multiple: true
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Scrittura dell'indice
        run: |
          ls -la lavoro
          node tools/indice/costruisci.js unisci --lavoro lavoro --uscita uscita/indice --archivio ${{ needs.piano.outputs.archivio }} --data ${{ needs.piano.outputs.data }} --dal ${{ needs.piano.outputs.dal }}
          du -sh uscita/indice; ls uscita/indice/fp | wc -l; cat uscita/indice/meta.json
      - name: Pubblica nel ramo "indice-build"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd uscita
          git init -q -b indice-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indice
          git commit -q -m "Indice di impronte ${{ needs.piano.outputs.archivio }} (run ${GITHUB_RUN_ID})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" indice-build
