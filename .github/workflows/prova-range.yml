name: Prova delle richieste parziali nei browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/prova_range.py
      - .github/workflows/prova-range.yml

permissions:
  contents: write

jobs:
  browser:
    # Playwright 1.56 non supporta ancora Ubuntu 26.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium firefox webkit
      - run: python3 tools/prova_range.py | tee browser.md
      - name: Pubblica il rapporto nel ramo "rapporti-browser"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/rep && cp browser.md /tmp/rep/
          cd /tmp/rep
          git init -q -b rapporti-browser
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser.md
          git commit -q -m "Prova dei browser ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" rapporti-browser
