name: Verifica copertura Common Crawl

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/copertura_colonne.py
      - .github/workflows/copertura.yml

permissions:
  contents: write

concurrency:
  group: copertura
  cancel-in-progress: true

jobs:
  archivio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { archivio: CC-MAIN-2026-43, extra: --diagnostica }
          - { archivio: CC-MAIN-2026-21, extra: '' }
          - { archivio: CC-MAIN-2025-51, extra: '' }
          - { archivio: CC-MAIN-2025-26, extra: '' }
          - { archivio: CC-MAIN-2024-51, extra: '' }
          - { archivio: CC-MAIN-2024-26, extra: '' }
          - { archivio: CC-MAIN-2023-50, extra: '' }
          - { archivio: CC-MAIN-2023-23, extra: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install duckdb==1.5.6
      - run: python3 tools/copertura_colonne.py ${{ matrix.archivio }} copertura-${{ matrix.archivio }}.json ${{ matrix.extra }}
      - uses: actions/upload-artifact@v4
        with:
          name: copertura-${{ matrix.archivio }}
          path: copertura-${{ matrix.archivio }}.json
          retention-days: 3

  rapporto:
    needs: [archivio]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dati
          merge-multiple: true
      - name: Rapporto
        run: |
          python3 - <<'EOF' > copertura.md
          import glob, json
          runs = sorted((json.load(open(f)) for f in glob.glob('dati/copertura-*.json')), key=lambda r: r['archivio'], reverse=True)
          print('# Copertura dei siti di studio in Common Crawl (indice a colonne)\n')
          print('Pagine HTML in italiano con stato 200, indirizzi unici, per archivio.\n')
          sites = list(runs[0]['siti']) if runs else []
          print('| sito | ' + ' | '.join(r['archivio'][8:] for r in runs) + ' | risposte non riuscite (' + (runs[0]['archivio'][8:] if runs else '') + ') |')
          print('|---|' + '---|' * (len(runs) + 1))
          for s in sites:
              cells = []
              for r in runs:
                  x = r['siti'].get(s, {})
                  cells.append(str(x.get('unici', 'errore: ' + x.get('errore', '?')[:40])))
              d = runs[0]['siti'].get(s, {}).get('diagnostica', {})
              print('| %s | %s | %s |' % (s, ' | '.join(cells), ', '.join('%s: %s' % kv for kv in d.items())))
          print()
          EOF
          cat copertura.md
      - name: Pubblica il rapporto nel ramo "rapporti"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/rep && cp copertura.md /tmp/rep/
          cd /tmp/rep
          git init -q -b rapporti
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add copertura.md
          git commit -q -m "Rapporto di copertura ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" rapporti
